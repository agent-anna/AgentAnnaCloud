<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Anna</title>
<style>
body{margin:0;background:#050816;color:#00d9ff;font-family:Segoe UI,Arial,sans-serif;}
header{padding:20px;border-bottom:1px solid rgba(0,217,255,.3);background:#07142a;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
h1{margin:0;font-size:24px;}
.container{padding:20px;max-width:1000px;margin:0 auto;}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));}
.panel{border:1px solid #00d9ff;border-radius:16px;background:#07142a;padding:20px;cursor:pointer;transition:all 0.2s ease;}
.panel:hover{border-color:#00ff88;box-shadow:0 0 15px rgba(0,255,136,0.15);}
.panel h2{margin-top:0;font-size:18px;border-bottom:1px solid rgba(0,217,255,0.2);padding-bottom:8px;}
.item{margin-bottom:8px;font-size:14px;}
.console-panel{border:1px solid #00d9ff;border-radius:16px;background:#07142a;padding:20px;margin-top:20px;}
textarea{width:100%;height:105px;background:#000;color:#00ffff;border:1px solid #00d9ff;border-radius:8px;padding:12px;box-sizing:border-box;font-family:inherit;font-size:15px;outline:none;}
button{margin-top:10px;padding:10px 18px;cursor:pointer;background:#00d9ff;color:#000;border:none;border-radius:8px;font-weight:bold;}
button:hover{opacity:0.85;}
button.secondary{background:#0b2244;color:#00d9ff;border:1px solid #00d9ff;}
button.danger{background:#ef4444;color:#fff;}
button.mic-btn{background:#10b981;color:#000;}
button.mic-btn.active{background:#ef4444;color:#fff;animation:pulse 1s infinite;}
@keyframes pulse{0%{opacity:1;}50%{opacity:0.4;}100%{opacity:1;}}
.status{color:#00ff88;font-weight:bold;font-size:13px;}
#response{margin-top:15px;padding:15px;border-radius:8px;background:#000;min-height:70px;white-space:pre-wrap;color:#e6f9ff;line-height:1.55;font-size:14px;border:1px solid rgba(0,217,255,0.2);}
#notification{position:fixed;bottom:20px;right:20px;background:#07142a;border:1px solid #00ff88;color:#00ff88;padding:12px 20px;border-radius:8px;display:none;z-index:2000;font-size:13px;box-shadow:0 0 15px rgba(0,255,136,0.2);}

/* Live Audio Visualizer Bars */
.visualizer{display:flex;gap:4px;align-items:center;height:35px;background:#000;border:1px solid rgba(0,217,255,0.3);border-radius:8px;padding:0 12px;margin-top:15px;overflow:hidden;}
.bar{flex:1;background:#00d9ff;height:4px;border-radius:2px;transition:height 0.05s ease;}
</style>
</head>
<body>

<header>
  <h1>Agent Anna</h1>
  <div style="display:flex;gap:15px;align-items:center;">
    <span id="hudState" class="status">READY</span>
  </div>
</header>

<div class="container">
  <div class="grid">
    <div class="panel" onclick="inspectAsset('brain.json', 'Brain Module')">
      <h2>Brain <span>🔍</span></h2>
      <div id="brain">Loading core...</div>
    </div>
    <div class="panel" onclick="inspectAsset('tasks.json', 'Tasks Matrix')">
      <h2>Tasks <span>🔍</span></h2>
      <div id="tasks">Loading tasks...</div>
    </div>
    <div class="panel" onclick="inspectAsset('memory.json', 'Neural Memory')">
      <h2>Memory & Links <span>🔍</span></h2>
      <div id="links">Loading links...</div>
    </div>
  </div>

  <div class="console-panel">
    <h2>Agent Console</h2>
    <textarea id="prompt" placeholder="Ask Anna anything... (Press Enter to send, Shift+Enter for new line)"></textarea>
    
    <!-- Live Audio Motion Visualizer -->
    <div class="visualizer" id="viz">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
      <button onclick="ask()">SEND</button>
      <button id="micBtn" class="mic-btn" onclick="toggleLiveMic()">🎙️ TAP TO SPEAK</button>
      <button class="secondary" onclick="toggleVoice()">🔊 TOGGLE VOICE (<span id="voiceState">ON</span>)</button>
      <button class="danger" onclick="executeStfuProtocol()">🛑 STFU / CANCEL</button>
    </div>
    <div id="response">Ready.</div>
  </div>
</div>

<div id="notification"></div>

<script>
let cachedVoices = [];
let isVoiceEnabled = true;
let audioContext = null;
let analyser = null;
let microphone = null;
let isMicActive = false;
let animationId = null;

function loadVoices() {
    if (!('speechSynthesis' in window)) return;
    try { cachedVoices = window.speechSynthesis.getVoices(); } catch (e) {}
}

if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();
}

function updateHUDState(state) {
    const hud = document.getElementById("hudState");
    if (hud) hud.textContent = state;
}

function showCyberNotification(msg) {
    const n = document.getElementById("notification");
    if (!n) return;
    n.textContent = msg;
    n.style.display = "block";
    setTimeout(() => { n.style.display = "none"; }, 3500);
}

function speakText(text) {
    if (!isVoiceEnabled || !('speechSynthesis' in window)) return;
    try {
        window.speechSynthesis.cancel();
        let cleanText = text
            .replace(/```[\s\S]*?```/g, ' [Code block omitted] ')
            .replace(/`[^`]*`/g, ' snippet ')
            .replace(/<[^>]*>/g, '')
            .replace(/[*_#`~=]/g, ' ')
            .trim();

        if (!cleanText) return;

        document.body.classList.remove('is-thinking');
        document.body.classList.add('is-speaking');
        updateHUDState("SPEAKING");

        let voices = window.speechSynthesis.getVoices();
        if (!voices || voices.length === 0) voices = cachedVoices;

        const utterance = new SpeechSynthesisUtterance(cleanText);
        const voice = voices.find(v => 
            v.name.includes("Google UK English Female") || 
            v.name.includes("Victoria") || 
            v.name.includes("Samantha") || 
            v.name.includes("Zira")
        ) || voices.find(v => v.lang.includes('en-GB') || v.lang.includes('en-US')) || voices[0];

        if (voice) utterance.voice = voice;
        utterance.pitch = 1.02;
        utterance.rate = 0.98;

        utterance.onend = () => {
            document.body.classList.remove('is-speaking');
            updateHUDState("READY");
        };
        utterance.onerror = () => {
            document.body.classList.remove('is-speaking');
            updateHUDState("READY");
        };

        window.speechSynthesis.speak(utterance);
    } catch (e) {
        document.body.classList.remove('is-speaking');
        updateHUDState("READY");
    }
}

// True Live Mic Audio Analyser with Real-time Visualizer Motion
async function toggleLiveMic() {
    const micBtn = document.getElementById("micBtn");
    
    if (isMicActive) {
        stopLiveMic();
        return;
    }

    try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        
        microphone = audioContext.createMediaStreamSource(stream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 64;
        microphone.connect(analyser);

        isMicActive = true;
        micBtn.textContent = "🔴 LISTENING (CLICK TO STOP)";
        micBtn.classList.add("active");
        updateHUDState("LISTENING");
        showCyberNotification("🎙️ Microphone active. Speak now — visualizer is reacting to your voice.");

        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        const bars = document.querySelectorAll(".visualizer .bar");

        function renderVisualizer() {
            if (!isMicActive) return;
            analyser.getByteFrequencyData(dataArray);

            bars.forEach((bar, i) => {
                const val = dataArray[i] || 0;
                const height = Math.max(4, (val / 255) * 32);
                bar.style.height = height + "px";
                bar.style.background = val > 50 ? "#00ff88" : "#00d9ff";
            });

            animationId = requestAnimationFrame(renderVisualizer);
        }
        renderVisualizer();

    } catch (err) {
        showCyberNotification("❌ Mic permission denied or unavailable.");
        stopLiveMic();
    }
}

function stopLiveMic() {
    isMicActive = false;
    if (animationId) cancelAnimationFrame(animationId);
    if (audioContext && audioContext.state !== 'closed') audioContext.close();
    
    const micBtn = document.getElementById("micBtn");
    micBtn.textContent = "🎙️ TAP TO SPEAK";
    micBtn.classList.remove("active");
    updateHUDState("READY");

    // Reset visualizer bars
    document.querySelectorAll(".visualizer .bar").forEach(bar => {
        bar.style.height = "4px";
        bar.style.background = "#00d9ff";
    });
}

function executeStfuProtocol() {
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    stopLiveMic();
    document.body.classList.remove('is-speaking', 'is-thinking');
    updateHUDState("READY");
    showCyberNotification("🛑 STFU COMMAND EXECUTED: Audio stream terminated.");
}

function toggleVoice() {
    isVoiceEnabled = !isVoiceEnabled;
    document.getElementById("voiceState").textContent = isVoiceEnabled ? "ON" : "OFF";
    if (!isVoiceEnabled) executeStfuProtocol();
    showCyberNotification(`Voice engine turned ${isVoiceEnabled ? "ON" : "OFF"}`);
}

document.getElementById("prompt").addEventListener("keydown", function(event) {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        ask();
    }
});

async function ask() {
    const promptInput = document.getElementById("prompt");
    const prompt = promptInput.value.trim();
    const resDiv = document.getElementById("response");
    if (!prompt) return;

    executeStfuProtocol();
    resDiv.textContent = "Anna is thinking...";
    document.body.classList.add('is-thinking');
    updateHUDState("THINKING");

    try {
        const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt })
        });

        const data = await res.json();
        let reply = data.reply || "No reply.";

        resDiv.textContent = reply;
        promptInput.value = "";
        speakText(reply);
    } catch (err) {
        resDiv.textContent = "Error: " + err;
        document.body.classList.remove('is-thinking');
        updateHUDState("READY");
    }
}

async function loadPortal() {
    try {
        const [brain, tasks, links] = await Promise.all([
            fetch("brain.json").then(r => r.json()),
            fetch("tasks.json").then(r => r.json()),
            fetch("links.json").then(r => r.json())
        ]);

        document.getElementById("brain").innerHTML =
            `<div class="item"><b>Agent:</b> ${brain.agent}</div>` +
            `<div class="item"><b>Owner:</b> ${brain.owner}</div>` +
            `<div class="item"><b>Status:</b> ${brain.status}</div>`;

        document.getElementById("tasks").innerHTML =
            tasks.map(t => `<div class="item">• ${t.task} (<b style="color:#00ff88">${t.status}</b>)</div>`).join("");

        document.getElementById("links").innerHTML =
            links.map(l => `<div class="item"><a href="${l.url}" target="_blank" style="color:#00ffff;text-decoration:underline;">${l.name}</a></div>`).join("");
    } catch (err) {
        console.warn("Portal data load fallback");
    }
}

loadPortal();
</script>

</body>
</html>
