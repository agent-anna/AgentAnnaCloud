<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Anna</title>
<style>
body{margin:0;background:#050816;color:#00d9ff;font-family:Segoe UI,Arial,sans-serif;}
header{padding:20px;border-bottom:1px solid rgba(0,217,255,.3);background:#07142a;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
h1{margin:0;}
.container{padding:20px;max-width:820px;margin:0 auto;}
.panel{border:1px solid #00d9ff;border-radius:16px;background:#07142a;padding:20px;margin-top:20px;}
textarea{width:100%;height:105px;background:#000;color:#00ffff;border:1px solid #00d9ff;border-radius:8px;padding:10px;box-sizing:border-box;font-family:inherit;font-size:15px;}
select{background:#000;color:#00ffff;border:1px solid #00d9ff;border-radius:8px;padding:8px 12px;font-size:13px;}
button{margin-top:10px;padding:10px 20px;cursor:pointer;background:#00d9ff;color:#000;border:none;border-radius:8px;font-weight:bold;}
button.secondary{background:#0b2244;color:#00d9ff;border:1px solid #00d9ff;}
.status{color:#00ff88;font-weight:bold;}
#response{margin-top:15px;padding:15px;border-radius:8px;background:#000;min-height:70px;white-space:pre-wrap;color:#e6f9ff;line-height:1.55;}
</style>
</head>
<body>

<header>
  <h1>Agent Anna</h1>
  <div style="display:flex;gap:12px;align-items:center;">
    <select id="voiceSelect" title="Cloud Neural Female Voice">
      <option value="Joanna" selected>Anna US (Adult Female)</option>
      <option value="Amy">Anna UK (British Female)</option>
      <option value="Kendra">Anna Warm (US Female)</option>
    </select>
    <div class="status">ONLINE</div>
  </div>
</header>

<div class="container">
  <div class="panel">
    <h2>Agent Console</h2>
    <textarea id="prompt" placeholder="Ask Anna anything..."></textarea>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button onclick="ask()">SEND</button>
      <button class="secondary" onclick="replayVoice()">REPLAY VOICE</button>
      <button class="secondary" onclick="stopVoice()">STOP VOICE</button>
    </div>
    <div id="response">Ready.</div>
  </div>
</div>

<script>
let currentAudio = null;
let lastReply = "";

function stopVoice() {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    currentAudio = null;
  }
}

function speakCloud(text) {
  if (!text) return;
  stopVoice();

  const clean = text
    .replace(/```[\s\S]*?```/g, "Code provided on screen.")
    .replace(/[#*_`>-]/g, " ")
    .replace(/\s+/g, " ")
    .trim();

  const voice = document.getElementById("voiceSelect").value || "Joanna";
  const chunks = clean.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [clean];
  let index = 0;

  function playNext() {
    if (index >= chunks.length) return;
    const chunk = chunks[index].trim();
    index++;
    if (!chunk) return playNext();

    const audioUrl = `/api/tts?voice=${encodeURIComponent(voice)}&text=${encodeURIComponent(chunk)}`;
    currentAudio = new Audio(audioUrl);
    currentAudio.onended = playNext;
    currentAudio.onerror = playNext;
    currentAudio.play().catch(err => console.warn("Audio blocked:", err));
  }

  playNext();
}

function replayVoice() {
  if (lastReply) speakCloud(lastReply);
}

async function ask() {
  const prompt = document.getElementById("prompt").value.trim();
  const resDiv = document.getElementById("response");
  if (!prompt) return;

  stopVoice();
  resDiv.textContent = "Anna is thinking...";

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt })
    });

    const data = await res.json();
    let reply = data.reply || "No reply.";

    lastReply = reply;
    resDiv.textContent = reply;
    speakCloud(reply);
  } catch (err) {
    resDiv.textContent = "Error: " + err;
  }
}
</script>

</body>
</html>
