<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Anna Dashboard</title>
<style>
body{margin:0;background:#050816;color:#00d9ff;font-family:Segoe UI,Arial,sans-serif;}
header{padding:20px;border-bottom:1px solid rgba(0,217,255,.3);background:#07142a;display:flex;justify-content:space-between;align-items:center;}
h1{margin:0;font-size:24px;}
.container{padding:20px;max-width:1000px;margin:0 auto;}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));}
.panel{border:1px solid #00d9ff;border-radius:16px;background:#07142a;padding:20px;cursor:pointer;}
.panel h2{margin-top:0;font-size:18px;border-bottom:1px solid rgba(0,217,255,0.2);padding-bottom:8px;}
.item{margin-bottom:8px;font-size:14px;}
.console-panel{border:1px solid #00d9ff;border-radius:16px;background:#07142a;padding:20px;margin-top:20px;}
textarea{width:100%;height:100px;background:#000;color:#00ffff;border:1px solid #00d9ff;border-radius:8px;padding:12px;box-sizing:border-box;font-family:inherit;font-size:15px;outline:none;}
button{margin-top:10px;padding:10px 18px;cursor:pointer;background:#00d9ff;color:#000;border:none;border-radius:8px;font-weight:bold;}
button:hover{opacity:0.85;}
button.secondary{background:#0b2244;color:#00d9ff;border:1px solid #00d9ff;}
button.danger{background:#ef4444;color:#fff;}
button.mic-btn{background:#10b981;color:#000;}
button.mic-btn.active{background:#ef4444;color:#fff;}
.status{color:#00ff88;font-weight:bold;font-size:13px;}
#response{margin-top:15px;padding:15px;border-radius:8px;background:#000;min-height:70px;white-space:pre-wrap;color:#e6f9ff;font-size:14px;border:1px solid rgba(0,217,255,0.2);}
</style>
</head>
<body>

<header>
  <h1>Agent Anna Dashboard</h1>
  <span id="hudState" class="status">READY</span>
</header>

<div class="container">
  <div class="grid">
    <div class="panel">
      <h2>Brain <span>🔍</span></h2>
      <div id="brain">Loading core...</div>
    </div>
    <div class="panel">
      <h2>Tasks <span>🔍</span></h2>
      <div id="tasks">Loading tasks...</div>
    </div>
    <div class="panel">
      <h2>Memory & Links <span>🔍</span></h2>
      <div id="links">Loading links...</div>
    </div>
  </div>

  <div class="console-panel">
    <h2>Agent Console</h2>
    <textarea id="prompt" placeholder="Type prompt or use mic..."></textarea>
    
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
      <button onclick="ask()">SEND</button>
      <button id="micBtn" class="mic-btn" onclick="toggleMic()">🎙️ TAP TO SPEAK</button>
      <button class="secondary" onclick="toggleVoice()">🔊 VOICE: <span id="voiceState">ON</span></button>
      <button class="danger" onclick="executeStfuProtocol()">🛑 STOP VOICE</button>
    </div>
    <div id="response">System online. Ready.</div>
  </div>
</div>

<script>
let cachedVoices = [];
let isVoiceEnabled = true;
let recognition = null;
let isListening = false;

function loadVoices() {
    if (!('speechSynthesis' in window)) return;
    try { cachedVoices = window.speechSynthesis.getVoices(); } catch (e) {}
}

if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();
}

function speakText(text) {
    if (!isVoiceEnabled || !('speechSynthesis' in window)) return;
    try {
        window.speechSynthesis.cancel();
        let cleanText = text
            .replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD00-\uDDFF])/g, '')
            .replace(/```[\s\S]*?```/g, ' [Code block omitted] ')
            .replace(/[*_#`~=]/g, ' ')
            .trim();

        if (!cleanText) return;

        let voices = window.speechSynthesis.getVoices();
        if (!voices || voices.length === 0) voices = cachedVoices;

        const utterance = new SpeechSynthesisUtterance(cleanText);
        const voice = voices.find(v => v.name.includes("Google UK English Female") || v.name.includes("Victoria") || v.name.includes("Samantha") || v.name.includes("Zira")) || voices[0];
        if (voice) utterance.voice = voice;

        window.speechSynthesis.speak(utterance);
    } catch (e) {}
}

function toggleMic() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        document.getElementById("response").textContent = "Speech recognition not supported in this browser. Please use Google Chrome.";
        return;
    }

    const micBtn = document.getElementById("micBtn");

    if (isListening) {
        if (recognition) { try { recognition.stop(); } catch(e){} }
        stopMicUI();
        return;
    }

    try {
        recognition = new SpeechRecognition();
        recognition.lang = "en-US";
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = () => {
            isListening = true;
            micBtn.textContent = "⏹️ LISTENING (CLICK TO STOP)";
            micBtn.classList.add("active");
            document.getElementById("response").textContent = "Microphone active. Speak now...";
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            document.getElementById("prompt").value = transcript;
            document.getElementById("response").textContent = "Heard: " + transcript;
        };

        recognition.onerror = (event) => {
            document.getElementById("response").textContent = "Mic error: " + event.error;
            stopMicUI();
        };

        recognition.onend = () => {
            stopMicUI();
            const val = document.getElementById("prompt").value.trim();
            if (val) {
                ask();
            }
        };

        recognition.start();
    } catch (err) {
        document.getElementById("response").textContent = "Mic exception: " + err.message;
        stopMicUI();
    }
}

function stopMicUI() {
    isListening = false;
    const micBtn = document.getElementById("micBtn");
    micBtn.textContent = "🎙️ TAP TO SPEAK";
    micBtn.classList.remove("active");
}

function executeStfuProtocol() {
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    if (isListening) toggleMic();
}

function toggleVoice() {
    isVoiceEnabled = !isVoiceEnabled;
    document.getElementById("voiceState").textContent = isVoiceEnabled ? "ON" : "OFF";
    if (!isVoiceEnabled) executeStfuProtocol();
}

document.getElementById("prompt").addEventListener("keydown", function(event) {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        ask();
    }
});

async function ask() {
    const promptInput = document.getElementById("prompt");
    const prompt = promptInput.value.trim();
    const resDiv = document.getElementById("response");
    if (!prompt) return;

    if (isListening) toggleMic();
    executeStfuProtocol();
    resDiv.textContent = "Anna is thinking...";

    try {
        const res = await fetch("https://agentannacloud.agent-anna-aa01.workers.dev/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt })
        });

        const data = await res.json();
        let reply = data.reply || "No reply.";

        resDiv.textContent = reply;
        promptInput.value = "";
        speakText(reply);
    } catch (err) {
        resDiv.textContent = "Error connecting to backend: " + err;
    }
}

async function loadPortal() {
    try {
        const [brain, tasks, links] = await Promise.all([
            fetch("brain.json").then(r => r.json()),
            fetch("tasks.json").then(r => r.json()),
            fetch("links.json").then(r => r.json())
        ]);

        document.getElementById("brain").innerHTML = `<div class="item"><b>Agent:</b> ${brain.agent}</div><div class="item"><b>Owner:</b> ${brain.owner}</div>`;
        document.getElementById("tasks").innerHTML = tasks.map(t => `<div class="item">• ${t.task} (${t.status})</div>`).join("");
        document.getElementById("links").innerHTML = links.map(l => `<div class="item"><a href="${l.url}" target="_blank" style="color:#00ffff;">${l.name}</a></div>`).join("");
    } catch (err) {}
}

loadPortal();
</script>

</body>
</html>
